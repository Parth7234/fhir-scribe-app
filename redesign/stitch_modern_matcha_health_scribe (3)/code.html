<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aether Clinical - Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#161f00",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#849887",
                        "on-secondary-fixed-variant": "#623f22",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#394b3d",
                        "error": "#ba1a1a",
                        "on-surface": "#1a1c1c",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#b7ccb9",
                        "surface-bright": "#f9f9f9",
                        "on-secondary-container": "#795334",
                        "inverse-on-surface": "#f0f1f1",
                        "on-background": "#1a1c1c",
                        "primary-fixed": "#d9eaa3",
                        "on-tertiary-container": "#1e3023",
                        "on-surface-variant": "#46483c",
                        "inverse-primary": "#bdce89",
                        "on-error-container": "#93000a",
                        "surface": "#f9f9f9",
                        "surface-container-highest": "#e2e2e2",
                        "on-tertiary": "#ffffff",
                        "outline": "#76786b",
                        "on-tertiary-fixed": "#0e1f13",
                        "on-primary-container": "#253000",
                        "secondary": "#7c5637",
                        "surface-container": "#eeeeee",
                        "tertiary-fixed": "#d3e8d5",
                        "surface-container-high": "#e8e8e8",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "primary": "#56642b",
                        "on-secondary-fixed": "#2f1500",
                        "background": "#f9f9f9",
                        "inverse-surface": "#2f3131",
                        "on-primary-fixed-variant": "#3e4c16",
                        "secondary-fixed": "#ffdcc3",
                        "primary-container": "#8a9a5b",
                        "secondary-fixed-dim": "#efbc96",
                        "surface-tint": "#56642b",
                        "outline-variant": "#c6c8b8",
                        "primary-fixed-dim": "#bdce89",
                        "secondary-container": "#fecaa3",
                        "surface-container-low": "#f3f3f3",
                        "tertiary": "#506354",
                        "on-error": "#ffffff",
                        "surface-variant": "#e2e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-padding": "24px",
                        "unit": "8px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Decorative Background Elements for Depth -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0 flex justify-center items-center opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/20 blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-container/20 blur-[100px]"></div>
</div>
<!-- Main Login Card (Glassmorphism) -->
<main class="relative z-10 w-full max-w-[480px] bg-white/70 backdrop-blur-xl border border-primary/10 shadow-[0px_4px_20px_rgba(138,154,91,0.08)] rounded-xl p-8 md:p-10 flex flex-col gap-8">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-4">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container shadow-sm mb-2">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Aether Clinical</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Sign in to access your dashboard</p>
</div>
</header>
<!-- Role Tabs -->
<nav aria-label="Role selection" class="flex p-1 bg-surface-container-low rounded-lg border border-outline-variant/30">
<button class="flex-1 py-2.5 rounded-md bg-secondary-container text-on-secondary-container shadow-sm font-label-md text-label-md transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">stethoscope</span>
                Doctor
            </button>
<button class="flex-1 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-variant/50 font-label-md text-label-md transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">person</span>
                Patient
            </button>
<button class="flex-1 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-variant/50 font-label-md text-label-md transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">admin_panel_settings</span>
                Admin
            </button>
</nav>
<!-- Login Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface ml-1" for="email">Email Address</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline-variant/70 shadow-sm" id="email" name="email" placeholder="dr.smith@aether.clinic" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1 mr-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline-variant/70 shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-4 mt-2 bg-primary text-on-primary rounded-lg font-label-md text-label-md shadow-md hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer / Support -->
<div class="text-center mt-2 border-t border-outline-variant/30 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                Need clinical access? <a class="font-label-md text-label-md text-primary hover:underline" href="#">Contact Administration</a>
</p>
</div>
</main>
</body></html>
